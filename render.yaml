services:
  - type: web
    name: scholarship-hunter-backend
    env: python
    region: oregon
    plan: free
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: PYTHON_VERSION
        value: 3.10.11
      - key: RELOAD
        value: "false"
      - key: CORS_ORIGINS
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: scholarship-hunter-db
          property: connectionString

databases:
  - name: scholarship-hunter-db
    databaseName: scholarship_hunter
    user: scholar_user
    plan: free
    region: oregon
